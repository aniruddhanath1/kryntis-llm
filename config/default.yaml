# ─── Service ───────────────────────────────────────────────
service:
  host: "0.0.0.0"
  port: 8000
  reload: false
  log_level: "INFO"
  internal_key_header: "X-Kryntis-Key"
  cors_origins:
    - "http://localhost:3000"    # React dev server
    - "http://localhost:8080"    # Spring Boot gateway
    - "http://localhost:5173"    # Vite dev server
    - "*"                        # Open during development; restrict in prod

# ─── Model ─────────────────────────────────────────────────
model:
  backend: "llama_cpp"          # llama_cpp | transformers
  path: "data/models/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf"
  context_length: 4096
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repeat_penalty: 1.1
  threads: 4
  gpu_layers: 0                 # 0 = CPU only
  idle_unload_seconds: 300      # Unload model after 5 min idle

# ─── Tokenizer ─────────────────────────────────────────────
tokenizer:
  vocab_size: 32000
  min_frequency: 2
  special_tokens:
    pad: "<pad>"
    unk: "<unk>"
    bos: "<s>"
    eos: "</s>"
    sep: "<sep>"
    system: "<|system|>"
    user: "<|user|>"
    assistant: "<|assistant|>"

# ─── RAG ───────────────────────────────────────────────────
rag:
  embedder_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedder_batch_size: 32
  dense_top_k: 20
  rerank_top_k: 5
  bm25_weight: 0.3
  dense_weight: 0.7
  min_score_threshold: 0.3

# ─── Chunking ──────────────────────────────────────────────
chunking:
  default_chunk_size: 512       # tokens
  default_chunk_overlap: 64     # tokens
  min_chunk_size: 50
  max_chunk_size: 1024
  include_metadata: true
  hierarchical: true            # parent + child chunks

# ─── Knowledge Store ───────────────────────────────────────
knowledge:
  vector_backend: "chroma"      # chroma | faiss
  chroma_path: "data/knowledge/chroma"
  sqlite_path: "data/knowledge/kryntis.db"
  collection_name: "kryntis_knowledge"

# ─── Memory ────────────────────────────────────────────────
memory:
  short_term_max_turns: 20
  short_term_max_tokens: 2048
  long_term_collection: "kryntis_memory"
  episodic_collection: "kryntis_episodes"
  consolidation_interval_seconds: 3600
  consolidation_similarity_threshold: 0.92

# ─── Ingestion ─────────────────────────────────────────────
ingestion:
  max_files_per_batch: 10
  max_file_size_bytes: 104857600   # 100 MB
  allowed_mime_types:
    - "application/pdf"
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
    - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    - "application/vnd.ms-excel"
    - "text/plain"
    - "text/csv"
    - "text/html"
    - "application/json"
    - "application/xml"
    - "text/xml"
    - "text/x-python"
    - "text/javascript"
    - "application/x-javascript"
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "image/webp"
  upload_dir: "data/uploads"
  streaming_chunk_bytes: 8192

# ─── Internet Research ─────────────────────────────────────
internet:
  enabled: true
  search_engine: "duckduckgo"   # duckduckgo | brave
  max_results: 10
  max_content_length: 50000     # chars per page
  request_timeout: 15
  max_concurrent_fetches: 3
  min_domain_trust_score: 0.3
  min_confidence_to_learn: 0.75
  respect_robots_txt: true
  blocked_domains:
    - "spam.com"
    - "malware.com"

# ─── Continual Learning ────────────────────────────────────
learning:
  enabled: true
  confidence_threshold: 0.75
  min_confidence: 0.5
  auto_approve_above_confidence: 0.85
  require_human_approval: false
  max_items_per_batch: 100
  snapshot_dir: "data/knowledge/snapshots"
  never_learn_from_self: true

# ─── Security ──────────────────────────────────────────────
security:
  prompt_injection_detection: true
  max_prompt_length: 8192
  audit_log_path: "data/logs/audit.jsonl"
  rate_limit_requests_per_minute: 60

# ─── Evaluation ────────────────────────────────────────────
evaluation:
  hallucination_check: true
  confidence_scoring: true
  min_confidence_to_respond: 0.2

# ─── Cache ─────────────────────────────────────────────────
cache:
  embedding_cache_size: 1000        # Max cached embedding vectors (no TTL; deterministic)
  search_cache_size: 200            # Max cached search result lists
  search_cache_ttl_seconds: 300     # 5 min TTL for search results
  response_cache_size: 100          # Max cached LLM responses (identical prompt+temperature)
  response_cache_ttl_seconds: 600   # 10 min TTL for response cache

# ─── Guardrails ────────────────────────────────────────────
# These switches map to SecuritySettings fields.
# All guardrails are enforced by kryntis/security/guardrails.py.
security:
  prompt_injection_detection: true   # Block prompt injection / instruction overrides
  block_toxic_input: true            # Block requests for dangerous/harmful content
  strip_pii_from_input: false        # Redact PII from user input before LLM sees it
  block_harmful_output: true         # Block LLM responses containing harmful content
  redact_pii_from_output: true       # Redact PII from LLM responses
  flag_uncertain_output: true        # Add metadata flag when LLM expresses uncertainty
  max_prompt_length: 8192
  rate_limit_requests_per_minute: 60
  audit_log_path: "data/logs/audit.jsonl"

# ─── MCP Server (Model Context Protocol) ───────────────────
# Enables an MCP-compliant JSON-RPC 2.0 server at /mcp.
# Any MCP client (Claude Desktop, Cursor, VS Code, custom agents) can connect.
mcp:
  enabled: true
  allowed_origins: []               # Empty = accept any origin (auth still required via key)

# ─── A2A Protocol (Agent-to-Agent) ─────────────────────────
# Enables Google's Agent-to-Agent interoperability protocol at /a2a.
# Agent Card is discoverable at /.well-known/agent.json (public, no auth).
a2a:
  enabled: true
  public_base_url: "http://localhost:8000"   # Override with your public URL in prod
