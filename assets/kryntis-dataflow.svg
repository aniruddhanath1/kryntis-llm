<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 830" width="100%" height="auto">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0369a1; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #0f172a; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 400; fill: #64748b; }
      .group-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      .conn-line { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="830" fill="#ffffff" rx="16" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ── 1. Top Level: Users / Clients (x:430..670, y:25..77) ──────────────── -->
  <g transform="translate(430, 25)">
    <rect width="240" height="52" rx="10" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="120" y="24" text-anchor="middle" class="title-text">End Users &amp; External Agents</text>
    <text x="120" y="40" text-anchor="middle" class="desc-text">CLI • REST • Web App • MCP • Voice Mic</text>
  </g>

  <!-- Connection: Top Users to Gateway -->
  <path d="M 550 77 L 550 145" class="conn-line" marker-end="url(#arrow)"/>

  <!-- ── 2. Container: Gateway & Security (y:115..325) ─────────────────────── -->
  <rect x="140" y="115" width="820" height="210" rx="12" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="160" y="135" class="group-label">Gateway &amp; Security Layer</text>

  <!-- Sub-node 2.1: API Gateway (x:410..690, y:145..197) -->
  <g transform="translate(410, 145)">
    <rect width="280" height="52" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="140" y="24" text-anchor="middle" class="title-text">FastAPI &amp; Protocol Gateway</text>
    <text x="140" y="40" text-anchor="middle" class="desc-text">Swagger UI (/docs) • SSE Stream • A2A • MCP</text>
  </g>

  <!-- Connection: Gateway to the 4 Subsystem Cards -->
  <!-- Split bar from y:197 down to y:213 -->
  <path d="M 550 197 L 550 213" class="conn-line"/>
  <path d="M 250 213 L 850 213" class="conn-line"/>
  <path d="M 250 213 L 250 230" class="conn-line" marker-end="url(#arrow)"/>
  <path d="M 450 213 L 450 230" class="conn-line" marker-end="url(#arrow)"/>
  <path d="M 650 213 L 650 230" class="conn-line" marker-end="url(#arrow)"/>
  <path d="M 850 213 L 850 230" class="conn-line" marker-end="url(#arrow)"/>

  <!-- Sub-nodes: Security & Pre-processing (y:230..300) -->
  <!-- 1. Security Card (x:160..340) -->
  <g transform="translate(160, 230)">
    <rect width="180" height="70" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="90" y="22" text-anchor="middle" class="sub-text">Security &amp; Rate Limiter</text>
    <text x="90" y="38" text-anchor="middle" class="desc-text">TokenBucket • SlidingWindow</text>
    <text x="90" y="52" text-anchor="middle" class="desc-text">PromptGuard &amp; PrivacyMasker</text>
  </g>

  <!-- 2. Chunk Router Card (x:360..550) -->
  <g transform="translate(360, 230)">
    <rect width="180" height="70" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="90" y="22" text-anchor="middle" class="sub-text">Universal ChunkRouter</text>
    <text x="90" y="38" text-anchor="middle" class="desc-text">Docs ≤ 100MB • Media ≤ 10MB</text>
    <text x="90" y="52" text-anchor="middle" class="desc-text">Guaranteed chunk hashing</text>
  </g>

  <!-- 3. Session Memory Card (x:560..750) -->
  <g transform="translate(560, 230)">
    <rect width="180" height="70" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="90" y="22" text-anchor="middle" class="sub-text">5B Session Stream</text>
    <text x="90" y="38" text-anchor="middle" class="desc-text">SQLite event stream storage</text>
    <text x="90" y="52" text-anchor="middle" class="desc-text">Hierarchical pagination</text>
  </g>

  <!-- 4. AI Tooling Card (x:760..940) -->
  <g transform="translate(760, 230)">
    <rect width="180" height="70" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.2"/>
    <text x="90" y="22" text-anchor="middle" class="sub-text">AI Tool Registry</text>
    <text x="90" y="38" text-anchor="middle" class="desc-text">Python REPL • SQL • Calc</text>
    <text x="90" y="52" text-anchor="middle" class="desc-text">Web Fetch • Telemetry Analyzer</text>
  </g>

  <!-- Connections from 4 Subsystem Cards down to 4 Lower Groups (y:300 to y:460) -->
  <path d="M 250 300 L 250 380 L 175 380 L 175 460" class="conn-line" marker-end="url(#arrow)"/>
  <path d="M 450 300 L 450 380 L 430 380 L 430 460" class="conn-line" marker-end="url(#arrow)"/>
  <path d="M 650 300 L 650 380 L 675 380 L 675 460" class="conn-line" marker-end="url(#arrow)"/>
  <path d="M 850 300 L 850 380 L 925 380 L 925 460" class="conn-line" marker-end="url(#arrow)"/>

  <!-- ── 3. Lower Tier: Core Subsystems (y:460..635) ──────────────────────── -->

  <!-- Group 3.1: Ingestion & Storage (x:60..290) -->
  <g transform="translate(60, 460)">
    <rect width="230" height="175" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="115" y="24" text-anchor="middle" class="group-label">Persistence &amp; Knowledge</text>

    <g transform="translate(15, 38)">
      <rect width="200" height="52" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.2"/>
      <text x="100" y="22" text-anchor="middle" class="title-text">SOLID Repositories</text>
      <text x="100" y="38" text-anchor="middle" class="desc-text">DocumentRepo • SessionRepo</text>
    </g>

    <g transform="translate(15, 102)">
      <rect width="200" height="56" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
      <text x="100" y="22" text-anchor="middle" class="title-text">Hybrid RAG Engine</text>
      <text x="100" y="38" text-anchor="middle" class="desc-text">BM25 + Dense Vector RRF</text>
      <text x="100" y="50" text-anchor="middle" class="desc-text">Cross-Encoder Reranker</text>
    </g>
  </g>

  <!-- Group 3.2: Cognitive Orchestration (x:315..545) -->
  <g transform="translate(315, 460)">
    <rect width="230" height="175" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="115" y="24" text-anchor="middle" class="group-label">Cognitive Orchestration</text>

    <g transform="translate(15, 38)">
      <rect width="200" height="52" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.2"/>
      <text x="100" y="22" text-anchor="middle" class="title-text">AI Orchestrator</text>
      <text x="100" y="38" text-anchor="middle" class="desc-text">IntentRouter • TaskDecomposer</text>
    </g>

    <g transform="translate(15, 102)">
      <rect width="200" height="56" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
      <text x="100" y="22" text-anchor="middle" class="title-text">Emotional Intelligence (EQ)</text>
      <text x="100" y="38" text-anchor="middle" class="desc-text">Sentiment &amp; Valence Analysis</text>
      <text x="100" y="50" text-anchor="middle" class="desc-text">Empathy-Tuned System Prompts</text>
    </g>
  </g>

  <!-- Group 3.3: Neural & Voice Execution (x:560..790) -->
  <g transform="translate(560, 460)">
    <rect width="230" height="175" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="115" y="24" text-anchor="middle" class="group-label">Neural &amp; Voice Execution</text>

    <g transform="translate(15, 38)">
      <rect width="200" height="52" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.2"/>
      <text x="100" y="22" text-anchor="middle" class="title-text">Voice System (TTS / STT)</text>
      <text x="100" y="38" text-anchor="middle" class="desc-text">Wave Synthesizer • Signal STT</text>
    </g>

    <g transform="translate(15, 102)">
      <rect width="200" height="56" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
      <text x="100" y="22" text-anchor="middle" class="title-text">Provider Load Balancers</text>
      <text x="100" y="38" text-anchor="middle" class="desc-text">RoundRobin • LeastLatency</text>
      <text x="100" y="50" text-anchor="middle" class="desc-text">Failover provider clustering</text>
    </g>
  </g>

  <!-- Group 3.4: Datasets & Continual Learning (x:810..1040) -->
  <g transform="translate(810, 460)">
    <rect width="230" height="175" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="115" y="24" text-anchor="middle" class="group-label">Training &amp; Human Feedback</text>

    <g transform="translate(15, 38)">
      <rect width="200" height="52" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.2"/>
      <text x="100" y="22" text-anchor="middle" class="title-text">UserTrainer Feedback Loop</text>
      <text x="100" y="38" text-anchor="middle" class="desc-text">Interactive human corrections</text>
    </g>

    <g transform="translate(15, 102)">
      <rect width="200" height="56" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
      <text x="100" y="22" text-anchor="middle" class="title-text">14 Pretrain Domain Corpora</text>
      <text x="100" y="38" text-anchor="middle" class="desc-text">AGI • 40+ Languages • Health</text>
      <text x="100" y="50" text-anchor="middle" class="desc-text">Fintech • Military • Gov • Media</text>
    </g>
  </g>

  <!-- Connections from 4 Lower Groups down to Transformer Model (y:635 to y:720) -->
  <path d="M 175 635 L 175 678 L 550 678" class="conn-line"/>
  <path d="M 430 635 L 430 678 L 550 678" class="conn-line"/>
  <path d="M 675 635 L 675 678 L 550 678" class="conn-line"/>
  <path d="M 925 635 L 925 678 L 550 678" class="conn-line"/>
  <path d="M 550 678 L 550 720" class="conn-line" marker-end="url(#arrow)"/>

  <!-- ── 4. Bottom Core: Byte Direct Transformer Core (x:340..760, y:720..795) ── -->
  <g transform="translate(340, 720)">
    <rect width="420" height="75" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
    <text x="210" y="28" text-anchor="middle" class="title-text" font-size="14">Tokenizer-Free Byte Direct Transformer v4.0 (with KV-Cache)</text>
    <text x="210" y="46" text-anchor="middle" class="sub-text">Direct UTF-8 Byte Stream Encoding • Vocab Size 260</text>
    <text x="210" y="62" text-anchor="middle" class="desc-text">Multi-Head Attention • Rotary RoPE • Auto-Regressive KV-Cache</text>
  </g>
</svg>
