[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kryntis-llm"
version = "1.0.0"
description = "Kryntis AI — Lightweight LLM platform with RAG, memory, continual learning, and internet research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kryntis AI" }]

[project.scripts]
kryntis = "main:main"
kryntis-service = "main:serve"

[tool.setuptools.packages.find]
where = ["."]
include = ["kryntis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
